<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="robots" content="noindex" />
    <title>صفحه پیدا نشد | نایلونیوم</title>
    <!--
      Deliberately plain HTML with inline styles rather than the React app.
      A 404 is what a visitor sees when something has already gone wrong, so
      it should not depend on a bundle loading correctly to render.
    -->
    <style>
      :root {
        color-scheme: light;
        --surface: #fff;
        --strong: #1e293b;
        --body: #4b5563;
        --line: #d7dde5;
        --brand: #047857;
        --brand-strong: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --surface: #0b1220;
          --strong: #f1f5f9;
          --body: #cbd5e1;
          --line: #24303f;
          --brand: #6ee7b7;
          --brand-strong: #34d399;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--surface);
        color: var(--body);
        font-family: 'Vazirmatn Variable', Vazirmatn, Tahoma, system-ui, sans-serif;
        text-align: center;
      }
      .mark {
        width: 60px;
        height: 60px;
        margin: 0 auto 1.75rem;
        border-radius: 18px;
        background: linear-gradient(135deg, #34d399, #059669 55%, #0e7490);
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        color: var(--strong);
        font-size: clamp(1.35rem, 1.1rem + 1.4vw, 1.9rem);
        line-height: 1.5;
      }
      p {
        margin: 0 auto 2rem;
        max-width: 32rem;
        font-size: 0.95rem;
        line-height: 2;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        border-radius: 1rem;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: opacity 0.4s cubic-bezier(0.33, 1, 0.45, 1);
      }
      a:hover {
        opacity: 0.85;
      }
      .primary {
        background: linear-gradient(to left, var(--brand-strong), #34d399);
        color: #fff;
      }
      .secondary {
        border: 1px solid var(--line);
        color: var(--strong);
      }
      .code {
        margin-top: 2.5rem;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 44 44" width="34" height="34" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 14c6-3 12-3 18 0" opacity=".55" />
          <path d="M13 21c6-3 12-3 18 0" opacity=".8" />
          <path d="M13 28c6-3 12-3 18 0" />
          <ellipse cx="13" cy="21" rx="3" ry="9" />
        </svg>
      </div>

      <h1>این صفحه پیدا نشد</h1>
      <p>
        ممکن است آدرس را اشتباه وارد کرده باشید یا این صفحه جابه‌جا شده باشد. از صفحه اصلی
        می‌توانید همه محصولات را ببینید.
      </p>

      <div class="actions">
        <a class="primary" href="/Nylonium/">بازگشت به صفحه اصلی</a>
        <a class="secondary" href="/Nylonium/tagheei.html">مشاهده محصولات</a>
      </div>

      <p class="code">۴۰۴</p>
    </main>
  </body>
</html>
