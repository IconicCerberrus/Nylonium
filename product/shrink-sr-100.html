<!doctype html>
<html lang="fa" dir="rtl" data-page="shrink" data-view="variant" data-variant="sr-100" data-root="../">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="رول ۱۰۰ میکرون — بار سنگین. ضخامت: ۱۰۰ میکرون، جمع‌شوندگی: تا ۵۰٪. تولید نایلونیوم با امکان سفارش در ابعاد دلخواه." />
    <title>رول ۱۰۰ میکرون | نایلون شیرینک — نایلونیوم</title>
    <script>
      // Prevent theme flash: apply stored/system theme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem('nylonium-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/product.jsx"></script>
  </body>
</html>
